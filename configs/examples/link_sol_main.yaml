schema_version: 3
project_name: Code2Play-Bench
catalog_path: benchmark/catalog.yaml
region: us-east-1

generation:
  protocol: staged_project_v1
  temperature: 0.2
  attempts: 2
  retry_delays_seconds: [2]
  stop_on_truncation: true
  semantic_retries: 0
  total_max_output_tokens: 18000
  stages:
    - id: state
      target: state.py
      max_output_tokens: 4000
    - id: game
      target: game.py
      max_output_tokens: 7000
    - id: rendering
      target: rendering.py
      max_output_tokens: 5000
    - id: main
      target: main.py
      max_output_tokens: 2000

judge:
  policy: link_sol_single_pass_v1
  provider: link_openai
  model: gpt-5.6-sol
  api_style: chat_completions
  temperature: 0.0
  stateless: true
  enable_thinking: false
  attempts: 2
  retry_delays_seconds: [2]
  scoring_repetitions: 1
  aggregation: single_valid_response
  routing:
    strategy: role_profile_v1
    roles:
      text: link_sol
      vision: link_sol
    role_modalities:
      action_compiler: text
      functionality: text
      specification_deviation: text
      code_quality: text
      artistic_visual: vision
      dynamic_visual: vision
      question_generation: vision
      question_answering: vision
      contract_generation: text
    profiles:
      link_sol:
        provider: link_openai
        model: gpt-5.6-sol
        api_style: chat_completions
        api_key_env: LINK_API_KEY
        base_url: https://ai.klinkw.com/v1
        response_format:
          type: json_object
  compiler:
    max_checkpoints_per_batch: 8
  visual:
    max_transitions_per_batch: 4
    max_images_per_batch: 12
  routes:
    action_compiler:
      provider: link_openai
      model: gpt-5.6-sol
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 6000
    functionality:
      provider: link_openai
      model: gpt-5.6-sol
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 2000
    specification_deviation:
      provider: link_openai
      model: gpt-5.6-sol
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 800
    code_quality:
      provider: link_openai
      model: gpt-5.6-sol
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 1200
    artistic_visual:
      provider: link_openai
      model: gpt-5.6-sol
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 800
    dynamic_visual:
      provider: link_openai
      model: gpt-5.6-sol
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 2000
    question_generation:
      provider: link_openai
      model: gpt-5.6-sol
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 1000
    question_answering:
      provider: link_openai
      model: gpt-5.6-sol
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 500
    contract_generation:
      provider: link_openai
      model: gpt-5.6-sol
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 2000

evaluation:
  d1_gate_mode: contribution_only
  d2_workers: 4
  sampling_timeout_seconds: 45
  weights:
    D1: 0.20
    D2: 0.50
    D3: 0.15
    D4: 0.15

models:
  - id: gpt_5_6_sol
    name: GPT-5.6 Sol
    provider: link_openai
    model: gpt-5.6-sol
    api_style: chat_completions
    api_key_env: LINK_API_KEY
    base_url: https://ai.klinkw.com/v1
