schema_version: 3
project_name: Code2Play-Bench
catalog_path: benchmark/catalog.yaml
region: us-east-1

generation:
  protocol: staged_project_v1
  temperature: 0.2
  attempts: 2
  retry_delays_seconds: [2]
  stop_on_truncation: true
  semantic_retries: 0
  total_max_output_tokens: 18000
  stages:
    - id: state
      target: state.py
      max_output_tokens: 4000
    - id: game
      target: game.py
      max_output_tokens: 7000
    - id: rendering
      target: rendering.py
      max_output_tokens: 5000
    - id: main
      target: main.py
      max_output_tokens: 2000
  difficulty_overrides:
    hard:
      total_max_output_tokens: 31000
      stages:
        - id: state
          target: state.py
          max_output_tokens: 5000
        - id: game
          target: game.py
          max_output_tokens: 14000
        - id: rendering
          target: rendering.py
          max_output_tokens: 10000
        - id: main
          target: main.py
          max_output_tokens: 2000

judge:
  policy: aws_mantle_vl_qwen235b_2507_text
  provider: aws_mantle
  model: qwen.qwen3-235b-a22b-2507
  api_style: chat_completions
  temperature: 0.0
  stateless: true
  enable_thinking: false
  attempts: 2
  retry_delays_seconds: [2]
  scoring_repetitions: 1
  aggregation: single_valid_response
  routing:
    strategy: role_profile_v1
    roles:
      text: aws_mantle_qwen235b
      vision: aws_mantle_vl
      contract: aws_mantle_coder
    role_modalities:
      action_compiler: text
      functionality: text
      specification_deviation: text
      code_quality: text
      artistic_visual: vision
      dynamic_visual: vision
      question_generation: vision
      question_answering: vision
      contract_generation: contract
    profiles:
      aws_mantle_qwen235b:
        provider: aws_mantle
        model: qwen.qwen3-235b-a22b-2507
        api_style: chat_completions
        api_key_env: AWS_MANTLE_API_KEY
        base_url: https://bedrock-mantle.us-east-1.api.aws/v1
        response_format:
          type: json_object
      aws_mantle_coder:
        provider: aws_mantle
        model: qwen.qwen3-coder-next
        api_style: chat_completions
        api_key_env: AWS_MANTLE_API_KEY
        base_url: https://bedrock-mantle.us-east-1.api.aws/v1
        response_format:
          type: json_object
      aws_mantle_vl:
        provider: aws_mantle
        model: qwen.qwen3-vl-235b-a22b-instruct
        api_style: chat_completions
        api_key_env: AWS_MANTLE_API_KEY
        base_url: https://bedrock-mantle.us-east-1.api.aws/v1
        response_format:
          type: json_object
  compiler:
    max_checkpoints_per_batch: 8
  visual:
    max_transitions_per_batch: 4
    max_images_per_batch: 12
  routes:
    action_compiler:
      provider: aws_mantle
      model: qwen.qwen3-235b-a22b-2507
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 24000
    functionality:
      provider: aws_mantle
      model: qwen.qwen3-235b-a22b-2507
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 2000
    specification_deviation:
      provider: aws_mantle
      model: qwen.qwen3-235b-a22b-2507
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 800
    code_quality:
      provider: aws_mantle
      model: qwen.qwen3-235b-a22b-2507
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 1200
    artistic_visual:
      provider: aws_mantle
      model: qwen.qwen3-vl-235b-a22b-instruct
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 800
    dynamic_visual:
      provider: aws_mantle
      model: qwen.qwen3-vl-235b-a22b-instruct
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 2000
    question_generation:
      provider: aws_mantle
      model: qwen.qwen3-vl-235b-a22b-instruct
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 1000
    question_answering:
      provider: aws_mantle
      model: qwen.qwen3-vl-235b-a22b-instruct
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 500
    contract_generation:
      provider: aws_mantle
      model: qwen.qwen3-coder-next
      api_style: chat_completions
      enable_thinking: false
      max_output_tokens: 2000

evaluation:
  d1_gate_mode: contribution_only
  d2_workers: 4
  sampling_timeout_seconds: 45
  weights:
    D1: 0.20
    D2: 0.50
    D3: 0.15
    D4: 0.15

models:
  - id: qwen3_7_plus
    name: Qwen3.7 Plus
    provider: alibaba_dashscope
    model: qwen3.7-plus
    api_style: chat_completions
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
